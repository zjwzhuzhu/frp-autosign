name: FRP Auto Sign-in

on:
  schedule:
    # 北京时间 09:07 / 13:31 / 20:53（非整点，降低 GitHub 调度拥堵丢单）
    - cron: '7 1 * * *'
    - cron: '31 5 * * *'
    - cron: '53 12 * * *'
  workflow_dispatch:
    inputs:
      selftest:
        description: '只测九宫格识别（不提交签到）'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: frp-autosign
  cancel-in-progress: false

jobs:
  signin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 下载 MobileNet 分类模型（仅作识图兜底，失败不影响主流程）
        continue-on-error: true
        run: |
          mkdir -p models
          curl -sL -o models/mobilenet.onnx \
            "https://github.com/onnx/models/raw/main/validated/vision/classification/mobilenet/model/mobilenetv2-12.onnx"
          ls -la models/mobilenet.onnx

      - name: 随机抖动（拟人化，1~6 分钟）
        run: |
          SEC=$(( (RANDOM % 300) + 60 ))
          echo "等待 ${SEC} 秒后开始签到..."
          sleep "$SEC"

      - name: 88frp 签到
        env:
          FRP88_USERNAME: ${{ secrets.FRP88_USERNAME }}
          FRP88_PASSWORD: ${{ secrets.FRP88_PASSWORD }}
        run: python check_88frp.py

      - name: natfrp 签到（需要视觉模型密钥）
        continue-on-error: true
        env:
          NATFRP_USERNAME: ${{ secrets.NATFRP_USERNAME }}
          NATFRP_PASSWORD: ${{ secrets.NATFRP_PASSWORD }}
          VISION_API_BASE: ${{ secrets.VISION_API_BASE }}
          VISION_API_KEY: ${{ secrets.VISION_API_KEY }}
          VISION_MODEL: ${{ secrets.VISION_MODEL }}
          VISION_MODEL_FALLBACK: ${{ secrets.VISION_MODEL_FALLBACK }}
          MAX_RETRIES: '6'
        run: python natfrp/auto_signin.py

      # 手动触发时勾选 selftest：只做九宫格识别验证，不消耗当天签到
      - name: natfrp 九宫格自检（不签到）
        if: ${{ inputs.selftest }}
        continue-on-error: true
        env:
          NATFRP_USERNAME: ${{ secrets.NATFRP_USERNAME }}
          NATFRP_PASSWORD: ${{ secrets.NATFRP_PASSWORD }}
          VISION_API_BASE: ${{ secrets.VISION_API_BASE }}
          VISION_API_KEY: ${{ secrets.VISION_API_KEY }}
          VISION_MODEL: ${{ secrets.VISION_MODEL }}
          VISION_MODEL_FALLBACK: ${{ secrets.VISION_MODEL_FALLBACK }}
        run: python probe_click_accuracy.py 3

      - name: 上传验证码样本（便于复盘）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captcha-samples
          path: captcha_probe/*.png
          if-no-files-found: ignore
          retention-days: 7
